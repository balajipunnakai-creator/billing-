<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Billing</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gl()"></script>
<style>
:root{--bg:#eceff2;--ink:#1c2a33;--mut:#5d6b75;--card:#fff;--ac:#f2b705;--ok:#0f766e;--bad:#b42318;--ln:#d5dbe0;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#12191e;--ink:#e8edf0;--mut:#94a3ad;--card:#1b252c;--ln:#2c3a43}}
*{box-sizing:border-box}
body{margin:0;font:500 16px 'Barlow Semi Condensed',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 80px}
main,#lg{max-width:640px;margin:0 auto;padding:14px}
h1,h2{margin:.2em 0 .5em;font-weight:700}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:0 0 10px}
.big{font-size:30px;font-weight:700}.m{color:var(--mut);font-size:14px}.up{color:var(--ok)}.dn{color:var(--bad)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:3px 0 8px}
label{font-size:14px;color:var(--mut)}
.b{background:var(--ac);color:#1c2a33;border:0;border-radius:8px;padding:11px 16px;font:700 16px inherit;font-family:inherit}
.b.s{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}
.it{padding:9px 0;border-top:1px solid var(--ln)}
#nv{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
#nv button{flex:1;padding:14px 0;border:0;background:none;color:var(--mut);font:700 15px inherit;font-family:inherit}
#nv button.on{color:var(--ink);box-shadow:inset 0 3px var(--ac)}
dialog{width:min(92vw,520px);border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);max-height:90vh}
img.p{max-height:50px;display:block;margin:4px 0}
[hidden]{display:none!important}.th{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);flex:none}</style></head><body>
<div id="lk" hidden style="position:fixed;inset:0;background:var(--bg);z-index:99;padding:20vh 20px 0;text-align:center"><h1>Enter PIN</h1><input id="pi" type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="max-width:240px;text-align:center;font-size:28px" oninput="if(this.value.length==4)tryPin()"><div id="pe" class="dn"></div></div><div id="bz" hidden style="position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center"><div class="c"><b>Saving, please wait...</b></div></div><div id="lg"><h1>Billing</h1><p class="m">Sign in with Google. Your data is saved in a Google Sheet in your own Drive.</p><button class="b" onclick="login()">Sign in with Google</button><p id="er" class="dn"></p></div>
<main id="v" hidden></main>
<nav id="nv" hidden></nav>
<dialog id="dlg"></dialog><dialog id="dlg2"></dialog>
<script>
const CID='63846305787-r7b7ppps9ok5v1fdm3su810a78rtdduh.apps.googleusercontent.com',SH='https://sheets.googleapis.com/v4/spreadsheets/';
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),
R=n=>'₹'+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),
nz=s=>String(s).toLowerCase().replace(/[^a-z0-9\u0b80-\u0bff]/g,''),
ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const H={Settings:['key','value'],Products:['id','name','part','alt','hsn','price','cost','gst','stock','rack','cupboard','box','brand','group','maxdisc','minstock','photo'],Invoices:['no','date','cust','phone','sub','cgst','sgst','total','disc','type','incl'],InvoiceItems:['no','name','part','hsn','qty','rate','gst','amount','disc','brand','ask','prod'],Purchases:['id','date','supplier','bill','sub','gst','total','round','file','adj'],PurchaseItems:['pid','name','part','qty','cost','gst','amount','prod','rec'],Expenses:['id','date','cat','amount','note'],Suppliers:['id','name','phone','brands','gstin','address','type'],Wanted:['id','date','item','part','brand','qty'],Orders:['id','date','supplier','item','part','brand','qty','got','status','ignore'],Enquiries:['id','date','item','part','brand','customer','phone','pid']};
const PF=[['name','Name used in shop'],['part','Part number'],['alt','Other names (comma separated)'],['hsn','HSN code'],['price','Selling price'],['cost','Purchase price'],['gst','GST %'],['stock','Stock'],['rack','Rack'],['cupboard','Cupboard'],['box','Box'],['brand','Brand (Hero, Honda, TVS, Fiam, Swiss...)'],['group','Same-part group (example: splendor side mirror)'],['maxdisc','Max discount % allowed (blank = no limit)'],['minstock','Minimum stock (below this goes to Wanted)']];
let tc,tok,sid,S={},D={Products:[],Invoices:[],InvoiceItems:[],Purchases:[],PurchaseItems:[],Expenses:[],Suppliers:[],Wanted:[],Orders:[],Enquiries:[]},cart=[],pc2=[],tab='home',iq='',eno='',eo=[],ws='',enqPre='',bd='',btype='G',bincl=null,bcn='',bcp='';
function gl(){tc=google.accounts.oauth2.initTokenClient({client_id:CID,scope:'https://www.googleapis.com/auth/drive.file',callback:()=>{}})}
function auth(p){return new Promise((ok,no)=>{tc.callback=r=>r.access_token?(tok=r.access_token,ok()):no(new Error(r.error||'Login failed'));tc.requestAccessToken({prompt:p})})}
async function api(u,o={},t=1){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}});
 if(r.status==401&&t){await auth('');return api(u,o,0)}
 if(!r.ok)throw new Error((await r.text()).slice(0,200));return r.json()}
let bzy=false;const busy=async f=>{if(bzy)return;bzy=true;$('#bz').hidden=false;try{await f()}catch(x){alert(x.message)}bzy=false;$('#bz').hidden=true};
async function login(){try{await auth('');await boot()}catch(x){$('#er').textContent=x.message}}
async function ensureTabs(){
 const m=await api(SH+sid+'?fields=sheets.properties.title'),have=m.sheets.map(s=>s.properties.title),need=Object.keys(H).filter(k=>!have.includes(k));
 await api(SH+sid+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:['Products','Invoices','InvoiceItems','Purchases','PurchaseItems','Suppliers'].filter(k=>have.includes(k)).map(k=>({range:k+'!A1',values:[H[k]]}))})});if(!need.length)return;
 await api(SH+sid+':batchUpdate',{method:'POST',body:JSON.stringify({requests:need.map(k=>({addSheet:{properties:{title:k}}}))})});
 await api(SH+sid+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:need.map(k=>({range:k+'!A1',values:[H[k]]}))})})}
async function boot(){
 sid=localStorage.sid;
 if(sid){try{await ensureTabs();await load()}catch(x){sid=null}}
 if(!sid){
  const f=await api('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent("name='Billing App Data' and trashed=false"));
  if(f.files.length)sid=f.files[0].id;
  else{const c=await api(SH,{method:'POST',body:JSON.stringify({properties:{title:'Billing App Data'},sheets:Object.keys(H).map(t=>({properties:{title:t}}))})});sid=c.spreadsheetId;
   await api(SH+sid+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:Object.keys(H).map(t=>({range:t+'!A1',values:[H[t]]}))})})}
  localStorage.sid=sid;await ensureTabs();await load()}
 $('#lg').hidden=true;$('#v').hidden=false;$('#nv').hidden=false;
 $('#nv').innerHTML=[['home','Home'],['bill','New bill'],['items','Items'],['buy','Purchase'],['more','More']].map(t=>`<button id="n_${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');go('home')}
async function load(){
 const r=await api(SH+sid+'/values:batchGet?'+Object.keys(H).map(t=>'ranges='+t).join('&')),K=Object.keys(H);
 r.valueRanges.forEach((v,i)=>{const t=K[i],rows=(v.values||[]).slice(1);
  if(t=='Settings'){S={};rows.forEach(x=>S[x[0]]=x[1]||'')}
  else D[t]=rows.map((x,j)=>{const o={_r:j+2};H[t].forEach((k,n)=>o[k]=x[n]??'');return o}).filter(o=>o[H[t][0]]!=='')});
 S.next=S.next||'1'}
const add=(t,rows)=>api(SH+sid+'/values/'+t+'!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:rows})});
const saveS=async()=>{await api(SH+sid+'/values/Settings!A1:B60:clear',{method:'POST'});
 await api(SH+sid+'/values/Settings!A1?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({values:[['key','value'],...Object.entries(S)]})})};
function go(t){tab=t;document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.id=='n_'+t));
 if(t!='bill'&&eno){eno='';eo=[];cart=[]}if(t!='buy')pc2=[];if(t!='nop')nsel={};$('#v').innerHTML={home,bill,items,buy,more,rep,exp,set,priv,want,enq,sups,nop,pl}[t]();if(t=='bill')rc();if(t=='items')il();if(t=='buy')rb();if(t=='nop')nsRender();if(t=='rep')drawRep()}
/* HOME */
function home(){
 const now=new Date(),cur=ymd(now).slice(0,7),im=gi(),m={};let td=0;
 D.Invoices.forEach(i=>{const v=isv(i,im).total,k=i.date.slice(0,7);m[k]=(m[k]||0)+v;if(i.date==ymd(now))td+=v});
 let p=0;for(let k=1;k<=3;k++){const d=new Date(now.getFullYear(),now.getMonth()-k,1);p+=m[ymd(d).slice(0,7)]||0}
 const avg=p/3,th=m[cur]||0,pc=avg?(th-avg)/avg*100:null,sv=D.Products.reduce((a,x)=>a+ +x.stock*+x.cost,0);
 return `<h1>${e(S.shop||'My shop')}</h1><div class="g">
 <div class="c"><div class="m">Stock value</div><div class="big">${R(sv)}</div><div class="m">${D.Products.length} items</div></div>
 <div class="c"><div class="m">Today's sale</div><div class="big">${R(td)}</div></div></div>
 <div class="c"><div class="m">This month's sale</div><div class="big">${R(th)}</div>
 <div class="${pc==null?'m':pc>=0?'up':'dn'}">${pc==null?'No earlier months yet':(pc>=0?'▲ ':'▼ ')+Math.abs(pc).toFixed(1)+'% vs last 3 months average ('+R(avg)+')'}</div></div>
 <div class="g"><button class="b s" onclick="go('rep')">Reports</button><button class="b s" onclick="go('exp')">Expenses</button></div><h2>Recent bills</h2>
 <div class="c">${D.Invoices.filter(i=>isv(i,im).n>0).slice(-20).reverse().map(i=>`<div class="it r" onclick="openB('${e(i.no)}')"><div>${e(i.no)} · ${e(i.cust)}<div class="m">${e(i.date)} · ${R(isv(i,im).total)}</div></div><span class="m">Open</span></div>`).join('')||'<div class="m">No bills yet. Tap New bill.</div>'}</div>`}
/* ITEMS */
function items(){return `<div class="r"><h1>Items</h1><button class="b" onclick="editP()">Add item</button></div>
 <input id="iq" placeholder="Search by part number or any name" value="${e(iq)}" oninput="iq=this.value;il()"><div id="il"></div>`}
const fp=q=>{const tk=String(q).toLowerCase().split(/\s+/).map(nz).filter(Boolean);return tk.length?D.Products.filter(p=>{const h=nz([p.name,p.part,p.brand,p.group,p.alt].join(' '));return tk.every(x=>h.includes(x))}):D.Products};
const loc=p=>[p.rack&&'Rack '+p.rack,p.cupboard&&'Cupboard '+p.cupboard,p.box&&'Box '+p.box].filter(Boolean).join(' · ');
function il(){$('#il').innerHTML=fp(iq).slice(0,60).map(p=>`<div class="c r" style="align-items:flex-start;justify-content:flex-start" onclick="editP('${p.id}')">${ph(p)}<div style="flex:1"><div class="r"><b>${e(p.name)}</b><span>${R(p.price)}</span></div><div class="m">${e(p.brand)} ${e(p.part)} · Stock ${e(p.stock)}</div><div class="m">${e(loc(p))}</div></div></div>`).join('')||'<div class="m">No items found.</div>'}
function editP(id){const p=D.Products.find(x=>x.id==id)||{};
 $('#dlg').innerHTML=`<h2>${id?'Edit item':'New item'}</h2>`+PF.map(([k,l])=>`<label>${l}</label><input id="f_${k}" value="${e(p[k])}">`).join('')+`<button class="b s" style="width:100%;margin:4px 0 10px" onclick="scan(v=>{$('#f_part').value=v})">Scan barcode into part number</button><label>Words to search the image (blank = part number + brand, or name + brand)</label><input id="fq"><button class="b s" style="width:100%" onclick="fimg('f_')">Find image on Google</button><div class="m" style="margin:6px 0 10px">Long-press the picture you like, save it, then choose it below.</div><label>Photo of the item (shown in search, never printed on the bill)</label>${p.photo?`<img class="th" style="width:120px;height:120px" src="https://drive.google.com/thumbnail?id=${e(p.photo)}&sz=w300"><br>`:''}<input id="f_photo" type="file" accept="image/*"><div class="r"><button class="b s" onclick="dlg.close()">Cancel</button><button class="b" onclick="saveP('${id||''}')">Save item</button></div>${id?`<button class="b s" style="width:100%;margin-top:10px;color:var(--bad)" onclick="delP('${id}')">Delete item</button>`:''}`;
 $('#dlg').showModal()}
function saveP(id){busy(async()=>{const v=PF.map(([k])=>$('#f_'+k).value.trim());if(!v[0])throw new Error('Enter the item name');
 const p=D.Products.find(x=>x.id==id),row0=0;let ph=p?p.photo||'':'';{const pf=$('#f_photo').files[0];if(pf)ph=(await drv(await shrink(pf,800,.75),'item-'+v[0]+'.jpg',true)).id}const row=[p?p.id:String(Date.now()),...v,ph];
 if(p)await api(SH+sid+`/values/Products!A${p._r}:Q${p._r}?valueInputOption=RAW`,{method:'PUT',body:JSON.stringify({values:[row]})});else await add('Products',[row]);
 await load();$('#dlg').close();go('items');il()})}
function delP(id){const p=D.Products.find(x=>x.id==id);if(!p)return;const m=o=>o.prod?o.prod==id:(o.name==p.name&&o.part==p.part),nb=new Set(D.InvoiceItems.filter(m).map(x=>x.no)).size,np=new Set(D.PurchaseItems.filter(m).map(x=>x.pid)).size;
 if(!confirm('Delete '+p.name+'?'+(nb||np?'\n\nThis item is in '+nb+' bill(s) and '+np+' purchase(s). Those records stay, but if you delete or edit them later, the stock of this item cannot be corrected.':'')))return;
 busy(async()=>{await api(SH+sid+`/values/Products!A${p._r}:Q${p._r}:clear`,{method:'POST'});$('#dlg').close();await load();go('items')})}
/* BILL */
const incl=()=>bincl==null?['1','yes','y'].includes(String(S.incl||'').toLowerCase()):bincl,tm=p=>(+p.gst>0)==(btype=='G');
function bill(){const i=D.Invoices.find(v=>v.no==eno)||{};return `<h1>${eno?'Edit '+e(eno):'New bill'}</h1><div class="c"><label>Bill type</label><select ${eno?'disabled':''} onchange="setType(this.value)"><option value="G" ${btype=='G'?'selected':''}>GST bill (tax invoice)</option><option value="N" ${btype=='N'?'selected':''}>Non-GST bill (bill of supply)</option></select>
 ${btype=='G'?`<label style="display:block;margin:6px 0"><input type="checkbox" style="width:auto;margin:0 8px 0 0" ${incl()?'checked':''} onchange="bincl=this.checked;rc()">Prices include GST (MRP)</label>`:''}
 <label>Customer name</label><input id="cn" value="${e(eno?i.cust:bcn)}" oninput="bcn=this.value"><label>Phone</label><input id="cp" type="tel" value="${e(eno?i.phone:bcp)}" oninput="bcp=this.value">
 <label>Add item (part number, brand or any name)</label><div class="r"><input id="bq" style="flex:1;min-width:0" oninput="rs()"><button class="b s" style="flex:none;margin:3px 0 8px" onclick="scan(scB)">Scan</button></div><div id="res"></div></div><div id="ct"></div>`}
function setType(v){const bad=cart.filter(c=>(+c.gst>0)!=(v=='G'));if(bad.length){if(!confirm(bad.length+' item(s) of the other type will be removed. Continue?')){go('bill');return}cart=cart.filter(c=>(+c.gst>0)==(v=='G'))}btype=v;go('bill')}
function rs(){const v=$('#bq').value,all=v?fp(v):[],l=all.filter(tm).slice(0,6);
 $('#res').innerHTML=l.map(p=>`<div class="it r" onclick="addC('${p.id}')">${ph(p)}<div style="flex:1">${e(p.name)}<div class="m">${e(p.brand)} · ${e(p.part)} · ${e(loc(p))}</div></div><div class="m">Stock ${e(p.stock)}<br>${R(p.price)}</div></div>`).join('')+(v&&!all.length?`<button class="b s" onclick="enqPre=$('#bq').value;go('enq')">Not found. Log enquiry for "${e(v)}"</button>`:'')+(v&&all.length&&!l.length?`<div class="dn">This item is ${btype=='G'?'Non-GST':'GST'}. Switch the bill type to add it.</div>`:'')}
function addC(id){const p=D.Products.find(x=>x.id==id),c=cart.find(x=>x.id==id),q=$('#bq').value;if(!tm(p))return alert('This item does not match the bill type.');
 if(c)c.qty++;else cart.push({id,r:p._r,name:p.name,part:p.part,hsn:p.hsn,qty:1,rate:+p.price,gst:+p.gst,stock:+p.stock,maxd:+p.maxdisc||0,brand:p.brand||'',ask:(p.brand&&nz(q).includes(nz(p.brand)))?'B':'',dt:''});
 $('#bq').value='';$('#res').innerHTML='';rc()}
function pd(s,b){s=String(s||'').trim();if(!s)return 0;return s.endsWith('%')?b*(parseFloat(s)||0)/100:(parseFloat(s)||0)}
function calc(){const inc=incl()&&btype=='G',L=cart.map(c=>{const g=c.qty*c.rate;return{...c,gross:g,cap:c.maxd?g*c.maxd/100:g,disc:0,hit:false}}),G=L.reduce((s,x)=>s+x.gross,0),man=[],auto=[];
 L.forEach(x=>{if(String(x.dt||'').trim()!==''){const w=pd(x.dt,x.gross);x.disc=Math.min(w,x.cap);x.hit=w>x.cap+.005;man.push(x)}else auto.push(x)});
 const M=man.reduce((s,x)=>s+x.disc,0),B=Math.min(pd(bd,G),L.reduce((s,x)=>s+x.cap,0));let rem=Math.max(0,B-M),act=auto.slice();
 for(let k=0;k<6&&rem>.005&&act.length;k++){const tg=act.reduce((s,x)=>s+x.gross,0)||1;let used=0;act.forEach(x=>{const s=Math.min(x.cap-x.disc,rem*x.gross/tg);x.disc+=s;used+=s});rem-=used;act=act.filter(x=>x.cap-x.disc>.005)}
 L.forEach(x=>{x.disc=Math.round(x.disc*100)/100;x.line=x.gross-x.disc;x.g=btype=='G'?+x.gst:0;x.amt=inc&&x.g?x.line/(1+x.g/100):x.line;x.tx=inc?x.line-x.amt:x.amt*x.g/100});
 const sub=L.reduce((s,x)=>s+x.amt,0),tax=L.reduce((s,x)=>s+x.tx,0);return{L,sub,tax,disc:L.reduce((s,x)=>s+x.disc,0),total:Math.round(sub+tax),short:rem>.01}}
function rc(){const t=calc(),g=btype=='G';
 $('#ct').innerHTML=cart.length?`<div class="c">${t.L.map((c,i)=>`<div class="it"><div class="r"><b>${e(c.name)}</b><button class="b s" onclick="cart.splice(${i},1);rc()">✕</button></div>
 <div class="m">${e(c.brand)}${c.maxd?' · max discount '+c.maxd+'%':''}</div>
 <div class="g"><div><label>Qty</label><input type="number" value="${c.qty}" onchange="cart[${i}].qty=+this.value;rc()"></div><div><label>Rate (${g&&incl()?'MRP, GST included':g?'before GST, GST added extra':'no GST'})</label><input type="number" value="${c.rate}" onchange="cart[${i}].rate=+this.value;rc()"></div></div>
 <label>Discount on this item (₹ or %, example 50 or 10%)${c.disc>0?' = '+R(c.disc):''}${c.hit?' · limit reached':''}</label><input value="${e(cart[i].dt)}" placeholder="auto from bill discount" onchange="cart[${i}].dt=this.value.trim();rc()"><div class="m">${g?'GST '+c.g+'% · ':''}line total ${R(c.line)}</div></div>`).join('')}
 <label>Bill discount (₹ or %, example 100 or 10%)</label><input value="${e(bd)}" onchange="bd=this.value.trim();rc()">${t.short?'<div class="dn">Item limits reached, bill discount not fully applied.</div>':''}
 <div class="r it"><span>Discount given</span><span>${R(t.disc)}</span></div><div class="r"><span>${g?'Taxable value':'Sub total'}</span><span>${R(t.sub)}</span></div>${g?`<div class="r"><span>CGST</span><span>${R(t.tax/2)}</span></div><div class="r"><span>SGST</span><span>${R(t.tax/2)}</span></div>`:''}${Math.abs(t.total-t.sub-t.tax)>=.005?`<div class="r"><span>Round off</span><span>${(t.total-t.sub-t.tax).toFixed(2)}</span></div>`:''}
 <div class="r it"><b>Total</b><span class="big">${R(t.total)}</span></div></div><button class="b" style="width:100%" onclick="saveB()">${eno?'Save changes':'Save bill'}</button>${eno?`<button class="b s" style="width:100%;margin-top:8px" onclick="eno='';eo=[];cart=[];bd='';bincl=null;go('home')">Cancel edit</button>`:''}`:''}
function nextNo(ty){const g=ty=='G',pre=g?(S.prefix||'INV-'):(S.prefixng||'NG-'),ex=new Set(D.Invoices.map(x=>x.no));

 <div class="c"><label>Add an item to Wanted</label><input id="wn" list="pl2"><datalist id="pl2">${D.Products.map(p=>`<option value="${e(p.name)}">`).join('')}</datalist><label>Quantity</label><input id="wq" type="number" value="1"><button class="b" onclick="addW()">Add</button></div>
 ${rows.map((r,i)=>`<div class="c"><div class="r"><b>${e(r.item)}</b><b>${r.left}</b></div><div class="m">${e(r.part)} · ${e(r.brand||'no brand')} · ${e(r.why.join(', '))}</div>${bs(r)}<div class="g" style="margin-top:8px"><button class="b" onclick="ordW(${i})">Order</button>${r.why.includes('Added by you')?`<button class="b s" onclick="rmW(${i})">Remove</button>`:'<span></span>'}</div></div>`).join('')||'<div class="c m">Nothing wanted right now.</div>'}
 <h2>Ordered</h2>${D.Orders.filter(o=>o.status=='ordered').map(o=>{const L=late(o);return `<div class="c" style="${L?'border-color:var(--bad)':''}"><div class="r"><b>${e(o.item)}</b><b class="${L?'dn':''}">${+o.qty-+o.got} pending</b></div><div class="m">${e(o.supplier)} · ordered ${e(o.date)} (${days(o.date)} days ago) · received ${e(o.got)} of ${e(o.qty)}</div>${L?`<div class="dn">Not received yet</div><div class="g"><button class="b s" onclick="ignO('${o.id}')">Ignore (next bill)</button><button class="b" onclick="reO('${o.id}')">Order from another supplier</button></div>`:`<button class="b s" onclick="reO('${o.id}')">Cancel order</button>`}</div>`}).join('')||'<div class="c m">No open orders.</div>'}`}
function addW(){busy(async()=>{const n=$('#wn').value.trim();if(!n)throw new Error('Enter the item');const p=D.Products.find(x=>nz(x.name)==nz(n));
 await add('Wanted',[['W'+Date.now(),ymd(new Date()),p?p.name:n,p?p.part:'',p?p.brand:'',+$('#wq').value||1]]);await load();go('want')})}
function rmW(i){busy(async()=>{const r=WR[i],L=D.Wanted.filter(w=>pk(w.item,w.part)==r.k);if(L.length)await api(SH+sid+'/values:batchClear',{method:'POST',body:JSON.stringify({ranges:L.map(w=>`Wanted!A${w._r}:F${w._r}`)})});await load();go('want')})}
function ordW(i){const r=WR[i];$('#dlg').innerHTML=`<h2>Order ${e(r.item)}</h2><div class="m">Wanted ${r.left}</div><label>Supplier</label><input id="os" list="sl2" value="${e(ws)}"><datalist id="sl2">${sup().map(s=>`<option value="${e(s)}">`).join('')}</datalist><label>Quantity to order from this supplier</label><input id="oq" type="number" value="${r.left}"><div class="m">Need 10 split 5 and 5? Order 5 here, then order the rest from another supplier.</div><div class="r"><button class="b s" onclick="dlg.close()">Cancel</button><button class="b" onclick="saveO(${i})">Place order</button></div>`;$('#dlg').showModal()}
function saveO(i){busy(async()=>{const r=WR[i],s=$('#os').value.trim(),q=+$('#oq').value;if(!s||!q)throw new Error('Enter supplier and quantity');
 await add('Orders',[['O'+Date.now(),ymd(new Date()),s,r.item,r.part,r.brand,q,0,'ordered','']]);
 if(!D.Suppliers.some(x=>nz(x.name)==nz(s)))await add('Suppliers',[['S'+Date.now(),s,'','']]);
 $('#dlg').close();await load();go('want')})}
const putc=(r,v)=>api(SH+sid+`/values/${r}?valueInputOption=RAW`,{method:'PUT',body:JSON.stringify({values:[[v]]})});
function ignO(id){busy(async()=>{const o=D.Orders.find(x=>x.id==id);await putc('Orders!J'+o._r,'1');await load();go('want')})}
function reO(id){busy(async()=>{const o=D.Orders.find(x=>x.id==id),left=+o.qty-+o.got;await putc('Orders!I'+o._r,'cancelled');if(left>0)await add('Wanted',[['W'+Date.now(),ymd(new Date()),o.item,o.part,o.brand,left]]);await load();go('want')})}
function supEdit(n){const x=D.Suppliers.find(v=>nz(v.name)==nz(n||''))||{name:n||''};
 $('#dlg').innerHTML=`<h2>${x.id?'Edit supplier':'New supplier'}</h2><label>Name</label><input id="sn" value="${e(x.name)}"><label>Phone</label><input id="sp" type="tel" value="${e(x.phone)}"><label>GSTIN</label><input id="sg" value="${e(x.gstin)}"><label>Supplier type</label><select id="sty"><option value="">Not set</option><option value="G" ${x.type=='G'?'selected':''}>GST supplier</option><option value="N" ${x.type=='N'?'selected':''}>Non-GST supplier (GST always 0 in purchases)</option></select><label>Address</label><input id="sa" value="${e(x.address)}"><label>Brands they supply (comma separated)</label><input id="sbr" value="${e(x.brands)}" placeholder="Hero, Honda"><div class="m">Brands are also learned from your purchase history.</div><div class="r"><button class="b s" onclick="dlg.close()">Cancel</button><button class="b" onclick="saveSup()">Save</button></div>${x.id?`<button class="b s" style="width:100%;margin-top:10px;color:var(--bad)" onclick="delSup('${e(x.id)}')">Delete supplier</button>`:''}`;$('#dlg').showModal()}
function saveSup(){busy(async()=>{const n=$('#sn').value.trim();if(!n)throw new Error('Enter the supplier name');const x=D.Suppliers.find(v=>nz(v.name)==nz(n)),row=[x?x.id:'S'+Date.now(),n,$('#sp').value.trim(),$('#sbr').value.trim(),$('#sg').value.trim(),$('#sa').value.trim(),$('#sty').value];
 if(x)await api(SH+sid+`/values/Suppliers!A${x._r}:G${x._r}?valueInputOption=RAW`,{method:'PUT',body:JSON.stringify({values:[row]})});else await add('Suppliers',[row]);$('#dlg').close();await load();go(tab)})}
function delSup(id){if(!confirm('Delete this supplier? Purchases already saved stay.'))return;busy(async()=>{const x=D.Suppliers.find(v=>v.id==id);await api(SH+sid+`/values/Suppliers!A${x._r}:G${x._r}:clear`,{method:'POST'});$('#dlg').close();await load();go(tab)})}
function sups(){return `<div class="r"><h1>Suppliers</h1><button class="b" onclick="supEdit('')">Add supplier</button></div>${D.Suppliers.map(s=>`<div class="c" onclick="supEdit('${e(s.name)}')"><b>${e(s.name)}</b><div class="m">${e([s.gstin&&'GSTIN '+s.gstin,s.phone,s.brands].filter(Boolean).join(' · '))}</div></div>`).join('')||'<div class="c m">No suppliers yet.</div>'}`}
async function recv(items,supn){const s=nz(supn),up=[],cl=[];
 items.forEach(c=>{let q=+c.qty;const k=pk(c.name,c.part);
  D.Orders.filter(o=>o.status=='ordered'&&nz(o.supplier)==s&&pk(o.item,o.part)==k).forEach(o=>{if(q<=0)return;const t=Math.min(+o.qty-+o.got,q);q-=t;const g=+o.got+t;up.push({range:'Orders!H'+o._r,values:[[g]]},{range:'Orders!I'+o._r,values:[[g>=+o.qty?'received':'ordered']]})});
  if(+c.qty>0){D.Wanted.filter(w=>pk(w.item,w.part)==k).forEach(w=>cl.push(`Wanted!A${w._r}:F${w._r}`));D.Enquiries.filter(w=>pk(w.item,w.part)==k).forEach(w=>cl.push(`Enquiries!A${w._r}:H${w._r}`))}});
 if(up.length)await api(SH+sid+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:up})});
 if(cl.length)await api(SH+sid+'/values:batchClear',{method:'POST',body:JSON.stringify({ranges:cl})})}
function enq(){const pre=enqPre;enqPre='';const c={};D.Enquiries.filter(x=>days(x.date)<=30).forEach(x=>{const k=pk(x.item,x.part);c[k]=c[k]||{n:0,x};c[k].n++});
 return `<h1>Enquiries</h1><div class="c"><label>Item asked for</label><input id="en" list="pl" value="${e(pre)}"><datalist id="pl">${D.Products.map(p=>`<option value="${e(p.name)}">`).join('')}</datalist><label>Brand (optional)</label><input id="eb"><label>Customer (optional)</label><input id="ec"><label>Phone (optional)</label><input id="ep" type="tel"><button class="b" onclick="saveE()">Save enquiry</button></div>
 <h2>Last 30 days</h2><div class="c">${Object.values(c).sort((a,b)=>b.n-a.n).map(o=>`<div class="it r"><span>${e(o.x.item)}</span><b>${o.n}${o.n>=(+S.enqThr||3)?' · in Wanted':''}</b></div>`).join('')||'<div class="m">No enquiries yet.</div>'}</div>`}
function saveE(){busy(async()=>{const n=$('#en').value.trim();if(!n)throw new Error('Enter the item');const p=D.Products.find(x=>nz(x.name)==nz(n));
 await add('Enquiries',[['E'+Date.now(),ymd(new Date()),p?p.name:n,p?p.part:'',$('#eb').value||(p?p.brand:''),$('#ec').value,$('#ep').value,p?p.id:'']]);await load();go('enq')})}
/* SCAN, IMAGE SEARCH, STOCK WITHOUT PURCHASE */
let scs=null,scT=0,nsel={},NL=[];const r2=x=>Math.round(x*100)/100;
$('#dlg2').addEventListener('close',()=>{clearInterval(scT);if(scs){scs.getTracks().forEach(t=>t.stop());scs=null}});
const supType=n=>{const x=D.Suppliers.find(v=>nz(v.name)==nz(n||''));return x?(x.type||(x.gstin?'G':'')):''};
const byCode=c=>{const n=nz(c);return n?D.Products.find(p=>nz(p.part)==n||String(p.alt).split(',').some(a=>nz(a)==n)):null};
async function scan(cb){if(!('BarcodeDetector' in window))return alert('This browser cannot scan barcodes. Please use Chrome on your Android phone.');
 $('#dlg2').innerHTML='<h2>Scan barcode</h2><video id="sv" playsinline muted autoplay style="width:100%;border-radius:8px;background:#000"></video><div class="m" style="margin:8px 0">Point the camera at the barcode</div><button class="b s" onclick="$(\'#dlg2\').close()">Cancel</button>';$('#dlg2').showModal();
 try{scs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#sv');v.srcObject=scs;await v.play();const det=new BarcodeDetector();let done=false;
  scT=setInterval(async()=>{if(done)return;try{const r=await det.detect(v);if(r.length&&r[0].rawValue){done=true;const c=r[0].rawValue;$('#dlg2').close();cb(c)}}catch(x){}},300)}
 catch(x){$('#dlg2').close();alert('Camera not available: '+x.message)}}
const scB=c=>{const p=byCode(c);if(p)addC(p.id);else{$('#bq').value=c;rs()}};
const scP=c=>{const p=byCode(c);if(p)addPC(p.id);else newItem('',c)};
function fimg(px){const g=k=>(($('#'+px+k)||{}).value||'').trim();let q=$('#fq').value.trim();
 if(!q)q=(g('part')?[g('brand'),g('part')]:[g('brand'),g('name'),g('group')]).filter(Boolean).join(' ');
 if(!q)return alert('Enter the part number or name first');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q),'_blank')}
function sameCust(no){const i=D.Invoices.find(x=>x.no==no);bcn=i.cust;bcp=i.phone;btype=itype(i)=='G'?'N':'G';cart=[];bd='';bincl=null;eno='';eo=[];$('#dlg').close();go('bill')}
function noPurchase(){const ids=new Set(),ks=new Set();D.PurchaseItems.forEach(x=>{if(x.prod)ids.add(x.prod);else ks.add(pk(x.name,x.part))});return D.Products.filter(p=>+p.stock>0&&!ids.has(p.id)&&!ks.has(pk(p.name,p.part)))}
function nop(){const n=noPurchase().length;return `<h1>Stock without purchase</h1><div class="c"><div class="m">Items that have stock but no purchase record: <b>${n}</b>. Pick a supplier, filter, tick the items and save. Stock does not change, only the purchase record (and GST) is added.</div></div>
 <div class="c"><label>Supplier</label><input id="ns" list="sl5" oninput="nsSup()"><datalist id="sl5">${sup().map(s=>`<option value="${e(s)}">`).join('')}</datalist>
 <label>Supplier type</label><select id="nt" onchange="nsSum()"><option value="G">GST supplier (each item's GST %)</option><option value="N">Non-GST supplier (GST 0)</option></select>
 <label>Show items with words (example bolt, Yamaha)</label><input id="nf" oninput="nsRender()">
 <div class="g"><button class="b s" onclick="nsAll(1)">Select all shown</button><button class="b s" onclick="nsAll(0)">Clear selection</button></div></div>
 <div id="nl"></div>
 <div class="c"><label>Supplier bill number (optional)</label><input id="nb"><label>Date</label><input id="nd" type="date" value="${ymd(new Date())}"><div class="m" id="nsum"></div><button class="b" style="width:100%;margin-top:8px" onclick="saveNop()">Save record (stock stays same)</button></div>`}
function nsSup(){const t=supType($('#ns').value);if(t)$('#nt').value=t;nsSum()}
function nsRender(){const tk=String($('#nf').value).toLowerCase().split(/\s+/).map(nz).filter(Boolean);
 NL=noPurchase().filter(p=>{const h=nz([p.name,p.part,p.brand,p.group,p.alt].join(' '));return tk.every(x=>h.includes(x))});
 $('#nl').innerHTML=`<div class="c">${NL.slice(0,150).map(p=>`<div class="it r" style="align-items:flex-start"><label style="display:flex;gap:8px;flex:1;color:var(--ink)"><input type="checkbox" style="width:auto;margin:4px 0 0" ${nsel[p.id]!=null?'checked':''} onchange="nsTog('${p.id}',this.checked)"><span>${e(p.name)}<div class="m">${e(p.brand)} ${e(p.part)} · GST ${e(p.gst||0)}% · cost ${R(p.cost)}</div></span></label><div style="width:84px"><label>Qty</label><input type="number" value="${nsel[p.id]??p.stock}" onchange="nsel['${p.id}']=+this.value;nsRender()"></div></div>`).join('')||'<div class="m">Nothing here. Every item has a purchase record.</div>'}${NL.length>150?`<div class="m">Showing 150 of ${NL.length}. Use the words box to narrow down.</div>`:''}</div>`;nsSum()}
function nsTog(id,on){if(on){const p=D.Products.find(x=>x.id==id);nsel[id]=+p.stock}else delete nsel[id];nsSum()}
function nsAll(on){if(on)NL.forEach(p=>{if(nsel[p.id]==null)nsel[p.id]=+p.stock});else nsel={};nsRender()}
function nsCalc(){const n=$('#nt').value=='N';let sub=0,gst=0,c=0,z=0;Object.keys(nsel).forEach(id=>{const p=D.Products.find(x=>x.id==id);if(!p)return;const a=r2((+p.cost||0)*nsel[id]),g=n?0:+p.gst||0;if(!(+p.cost>0))z++;sub+=a;gst+=r2(a*g/200)*2;c++});return{sub:r2(sub),gst:r2(gst),c,z}}
function nsSum(){const t=nsCalc();$('#nsum').textContent=t.c?`${t.c} items selected · taxable ${R(t.sub)} · GST ${R(t.gst)}`+(t.z?` · ${t.z} item(s) have purchase price 0`:''):'No items selected'}
function saveNop(){busy(async()=>{await load();const sp=$('#ns').value.trim();if(!sp)throw new Error('Enter the supplier');
 const ids=Object.keys(nsel).filter(i=>D.Products.some(p=>p.id==i)&&+nsel[i]>0);if(!ids.length)throw new Error('Select items first');
 const ty=$('#nt').value,dt=$('#nd').value||ymd(new Date()),bn=$('#nb').value.trim()||('ADJ-'+dt),id='P'+Date.now();
 const rows=ids.map(i=>{const p=D.Products.find(x=>x.id==i),q=+nsel[i],c=+p.cost||0,g=ty=='N'?0:(+p.gst||0);return[id,p.name,p.part,q,+c.toFixed(4),g,r2(c*q).toFixed(2),p.id,'1']});
 let sub=0,gst=0;rows.forEach(r=>{sub+=+r[6];gst+=r2(+r[6]*r[5]/200)*2});sub=r2(sub);gst=r2(gst);
 const x=D.Suppliers.find(v=>nz(v.name)==nz(sp));if(!x)await add('Suppliers',[['S'+Date.now(),sp,'','','','',ty]]);else if((x.type||'')!=ty)await putc('Suppliers!G'+x._r,ty);
 await add('Purchases',[[id,dt,sp,bn,sub.toFixed(2),gst.toFixed(2),r2(sub+gst).toFixed(2),'0','','1']]);await add('PurchaseItems',rows);
 nsel={};await load();alert('Saved '+rows.length+' items under '+sp+'. Stock not changed.');go('nop')})}
/* PRICE LIST (customer-safe: name, brand, part, MRP, availability only) */
function pl(){return `<h1>Price list</h1><div class="c"><div class="m">Makes a separate Google Sheet named "Price list" in your Drive with only: item, brand, part number, MRP and In stock / Out of stock. No purchase price, no stock count, no supplier, no rack. Share only this sheet with your Meta AI Gmail.</div></div>
 <div class="c"><button class="b" style="width:100%" onclick="updPL()">Update price list now</button><div class="m" style="margin-top:8px">${S.plid?'Last updated: '+e(S.pldate||'')+' · '+e(S.plcount||'')+' items':'Not created yet'}</div>${S.plid?`<a class="b s" style="display:block;text-align:center;margin-top:8px;text-decoration:none" target="_blank" href="https://docs.google.com/spreadsheets/d/${e(S.plid)}">Open price list sheet</a>`:''}</div>
 <div class="c"><label>Share (view only) with this Gmail</label><input id="plm" type="email" value="${e(S.plmail||'')}" placeholder="shopai@gmail.com"><button class="b" onclick="sharePL()">Share price list</button><div class="m" style="margin-top:8px">Only the Price list sheet is shared. Your Billing App Data sheet is not shared. Update the list after big stock changes.</div></div>`}
async function plRows(){return [['Item','Brand','Part number','MRP (Rs)','Availability'],...D.Products.filter(p=>+p.price>0).sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(p=>[p.name,p.brand||'',p.part||'',+p.price,+p.stock>0?'In stock':'Out of stock'])]}
function updPL(){busy(async()=>{await load();let id=S.plid,ti='Prices';
 if(id){try{const m=await api('https://sheets.googleapis.com/v4/spreadsheets/'+id+'?fields=sheets.properties.title');ti=m.sheets[0].properties.title}catch(x){id=''}}
 if(!id){const c=await api(SH,{method:'POST',body:JSON.stringify({properties:{title:'Price list'},sheets:[{properties:{title:ti}}]})});id=c.spreadsheetId;S.plid=id}
 const rows=await plRows();
 await api(SH+id+'/values/'+encodeURIComponent(ti)+'!A1:E5000:clear',{method:'POST'});
 await api(SH+id+'/values/'+encodeURIComponent(ti)+'!A1?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({values:rows})});
 S.pldate=new Date().toLocaleString('en-IN');S.plcount=String(rows.length-1);await saveS();alert('Price list updated: '+(rows.length-1)+' items');go('pl')})}
function sharePL(){busy(async()=>{const m=$('#plm').value.trim();if(!/^\S+@\S+\.\S+$/.test(m))throw new Error('Enter a valid Gmail address');if(!S.plid)throw new Error('Tap "Update price list now" first');
 await api('https://www.googleapis.com/drive/v3/files/'+S.plid+'/permissions?sendNotificationEmail=false',{method:'POST',body:JSON.stringify({role:'reader',type:'user',emailAddress:m})});
 S.plmail=m;await saveS();alert('Shared with '+m+' (view only)');go('pl')})}
/* SETTINGS */
const SF=[['shop','Shop name'],['addr','Address'],['phone','Phone'],['gstin','GSTIN'],['prefix','GST bill prefix (example INV-)'],['prefixng','Non-GST bill prefix (example NG-)'],['next','Next GST bill number (change it to restart, example 1)'],['nextng','Next Non-GST bill number'],['nummode','Bill numbers by date? type date, or leave blank for 1, 2, 3'],['incl','Prices include GST? type yes, or leave blank'],['enqThr','Enquiries before an item goes to Wanted (default 3)'],['lateDays','Days before an order turns red (default 3)']];
function set(){return `<h1>Settings</h1><div class="c">`+SF.map(([k,l])=>`<label>${l}</label><input id="s_${k}" value="${e(S[k])}">`).join('')+
 `<label>Terms and conditions</label><textarea id="s_terms" rows="4">${e(S.terms)}</textarea>
 <label>Logo</label>${S.logo?`<img class="p" src="${S.logo}">`:''}<input type="file" accept="image/*" onchange="up(this,'logo',240)">
 <label>Signature</label>${S.sign?`<img class="p" src="${S.sign}">`:''}<input type="file" accept="image/*" onchange="up(this,'sign',300)">
 <button class="b" onclick="saveSet()">Save settings</button></div><div class="c"><b>App PIN</b><div class="m">${localStorage.pinh?'PIN is on for this phone.':'No PIN set.'}</div><label>New 4-digit PIN</label><input id="np" type="password" inputmode="numeric" maxlength="4"><button class="b" onclick="setPin()">Save PIN</button>${localStorage.pinh?`<button class="b s" style="margin-left:8px" onclick="localStorage.removeItem('pinh');go('set')">Remove PIN</button>`:''}</div><button class="b s" onclick="localStorage.removeItem('sid');location.reload()">Sign out</button>`}
function up(el,k,max){const f=el.files[0];if(!f)return;const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);S[k]=c.toDataURL('image/jpeg',.7);go('set')};i.src=URL.createObjectURL(f)}
function saveSet(){busy(async()=>{SF.forEach(([k])=>S[k]=$('#s_'+k).value.trim());S.terms=$('#s_terms').value;await saveS();alert('Saved')})}
async function hp(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bill'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function lockUI(){if(!localStorage.pinh)return;$('#lk').hidden=false;$('#pi').value='';$('#pe').textContent=''}
async function tryPin(){if(await hp($('#pi').value)==localStorage.pinh){$('#lk').hidden=true;$('#pi').value=''}else{$('#pe').textContent='Wrong PIN';$('#pi').value=''}}
async function setPin(){const v=$('#np').value;if(!/^\d{4}$/.test(v))return alert('Enter exactly 4 digits');localStorage.pinh=await hp(v);alert('PIN saved on this phone');go('set')}
let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>60000)lockUI()});
lockUI();
</script></body></html>
